# SonarQube Cloud scanner configuration (CSCN73010 Assignment 3)
# Identifiers must match SonarQube Cloud exactly (Project > Information).
sonar.projectKey=jinobaby_Flask_Image_Recognition
sonar.organization=jinobaby
sonar.projectName=Flask_Image_Recognition

# --- Analysis scope ---------------------------------------------------------
# Application code: the Flask app, the model wrapper, and the front end
# (Jinja templates, upload script, stylesheet).
sonar.sources=app.py,model.py,templates,static
# pytest suite: analysed as test code, not counted in source issues/coverage.
sonar.tests=tests
# Never analyse the sample images or the trained model binary.
sonar.exclusions=test_images/**,**/*.h5

sonar.python.version=3.11
# Cobertura XML written by pytest-cov in the workflow
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
