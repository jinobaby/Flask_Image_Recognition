name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so SonarQube Cloud can use blame data and detect new code
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Wheels only: no setup.py/build scripts run during install.
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      # Python has no compile step; byte-compiling catches syntax errors and
      # Pylint is the project's existing static check (fail-under 9.0).
      - name: Build check (byte-compile + Pylint)
        run: |
          python -m compileall -q app.py model.py
          pylint app.py model.py tests

      - name: Run tests with coverage
        id: tests
        # Keep going if a test fails so the scan still runs; the outcome is
        # reported in the job summary instead of being hidden.
        continue-on-error: true
        run: pytest -v --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Flask_Image_Recognition CI"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- pytest: **${{ steps.tests.outcome }}**"
            if [ -f coverage.xml ]; then
              echo "- coverage.xml: generated (line-rate $(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1))"
            else
              echo "- coverage.xml: **missing**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SonarQube Cloud scan
        # Pinned to the full commit SHA of the v6 tag so the action cannot change under us
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
